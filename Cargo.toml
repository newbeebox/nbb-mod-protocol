[package]
name = "nbb-mod-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
dirs = "6.0.0"
glob = "0.3"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
tokio = { version = "1.45.1", features = [
    "fs",
    "io-util",
    "rt-multi-thread",
    "macros",
] }
walkdir = "2.5.0"
